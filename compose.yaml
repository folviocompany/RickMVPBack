services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: adi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d adi"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - adi_postgres_data:/var/lib/postgresql/data

volumes:
  adi_postgres_data:

