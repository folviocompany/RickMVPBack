services:
  - type: web
    name: rick-mvp-back
    runtime: docker
    plan: free
    region: virginia
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: UPLOAD_DIR
        value: /tmp/adi-uploads
      - key: MAX_UPLOAD_MB
        value: "20"
